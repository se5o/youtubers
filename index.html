<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft Creators</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: #fff; color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }
  main { max-width: 1200px; margin: 0 auto;
    padding: clamp(24px, 5vw, 48px) max(clamp(16px, 4vw, 24px), env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(clamp(16px, 4vw, 24px), env(safe-area-inset-left)); }

  /* ---------- segmented toggle ---------- */
  .controls { display: flex; justify-content: center; margin-bottom: clamp(32px, 6vw, 56px); }
  .seg { display: flex; align-items: center; gap: 2px; padding: 4px; background: #efefef; border-radius: 999px; max-width: 100%; }
  .segbtn {
    display: flex; align-items: center; gap: 8px;
    border: 0; border-radius: 999px; background: transparent; color: #767676;
    font-size: 16px; font-weight: 600; padding: 12px 24px; cursor: pointer; white-space: nowrap;
    transition: background-color .25s ease, color .25s ease, box-shadow .25s ease, transform .15s ease;
  }
  @media (hover: hover) { .segbtn:hover { color: #111; } }
  .segbtn:active { transform: scale(.97); }
  .segbtn:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  .segbtn.on { background: #fff; color: #111; box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.08); }
  .chev { width: 10px; height: 6px; transition: transform .25s ease; }
  .segbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .catwrap { position: relative; }
  .menu {
    position: absolute; top: calc(100% + 12px); right: 0; z-index: 5; min-width: 100%; width: max-content; max-width: calc(100vw - 32px); max-height: min(60vh, 420px); overflow-y: auto; overscroll-behavior: contain;
    background: #fff; border-radius: 20px; padding: 8px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.16);
    opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.97); transform-origin: top right;
    transition: opacity .2s ease, transform .2s cubic-bezier(.2,.7,.2,1), visibility 0s linear .2s;
  }
  .menu.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .item {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    font-size: 16px; font-weight: 600; color: #111; padding: 11px 16px; border-radius: 12px; cursor: pointer;
    transition: background-color .15s ease;
  }
  .item:focus-visible { background: #efefef; outline: none; }
  @media (hover: hover) { .item:hover { background: #efefef; } }
  .item.sel { background: #efefef; }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(36px, 5vw, 56px) clamp(12px, 2vw, 24px); }
  .card { display: flex; flex-direction: column; align-items: center; text-align: center;
    text-decoration: none; color: inherit; min-width: 0; }
  .card[hidden] { display: none; }
  .card:focus-visible { outline: 2px solid #111; outline-offset: 8px; border-radius: 12px; }
  .pfp {
    width: min(140px, 80%); height: auto; aspect-ratio: 1 / 1; border-radius: 50%; display: block; object-fit: cover;
    background: #eee; border: 1px solid #e2e2e2; box-shadow: 0 8px 18px rgba(0,0,0,.18);
    transition: transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease, opacity .5s ease;
  }
  .pfp.wait { animation: pulse 1.4s ease-in-out infinite; }
  .pfp.fade { opacity: 0; }
  @media (hover: hover) { .card:hover .pfp { transform: translateY(-4px) scale(1.03); box-shadow: 0 14px 26px rgba(0,0,0,.2); } }
  .name { margin-top: clamp(14px, 2.4vw, 24px); font-weight: 700; font-size: clamp(15px, 1.6vw, 17px); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subs { margin-top: 10px; font-size: 12px; letter-spacing: .06em; color: #666; font-variant-numeric: tabular-nums; }

  @keyframes pulse { 50% { background-color: #f6f6f6; } }

  /* tablets: 3 per row, phones: 2 per row, desktop: 4 per row */
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .segbtn { padding: 11px 18px; font-size: 15px; }
    .subs { font-size: 11px; }
  }
  @media (max-width: 340px) { .segbtn { padding: 10px 14px; font-size: 14px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="controls">
    <div class="seg">
      <button class="segbtn" id="popular" type="button" aria-pressed="false">Popular</button>
      <div class="catwrap">
        <button class="segbtn" id="catbtn" type="button" aria-haspopup="menu" aria-expanded="false">
          <span id="catlabel">Category</span>
          <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="menu" id="menu" role="menu"></div>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
/* ============ SETTINGS ============ */
// Paste your YouTube Data API v3 key here (keep the quotes).
const API_KEY = "AIzaSyCs6T5sq2ow9ZvQGlZiwElv7MCy91VF8QY";
const REFRESH_MINUTES = 10;   // how often subscriber counts / profile pictures are re-checked

/* Handle + categories. Edit freely: the dropdown builds itself from these.
   "✓" = category confirmed by research. No mark = best guess, worth double-checking. */
const CREATORS = [
  ["FlameFragsMC", ["SMP & Story", "PvP & Minigames"]],   // ✓ Unstable Universe / Lifesteal SMP
  ["ParrotX2", ["SMP & Story"]],                          // ✓ Unstable Universe, created Lifesteal's core idea
  ["wemmbumc", ["SMP & Story", "PvP & Minigames"]],       // ✓ Unstable SMP, started with Bedwars
  ["ForgeLabs", ["Mods"]],
  ["frosty", ["Hardcore"]],
  ["xNestorio", ["Hardcore", "Challenges", "Mods"]],      // ✓ Ultra Hardcore + "Minecraft, but" + mods
  ["Firelight", ["Hardcore"]],
  ["Evbo", ["Hardcore", "PvP & Minigames"]],
  ["SB737", ["SMP & Story"]],                             // ✓ Lifesteal SMP member
  ["Wisp", ["Challenges"]],                               // ✓ "Minecraft, but" challenges
  ["NotVixios", ["Horror", "Challenges"]],                   // horror per Sebo
  ["Vivilly", ["Horror", "Challenges"]],                      // horror per Sebo
  ["al1craft.", ["Hardcore"]],
  ["RoyalPear", ["Hardcore"]],
  ["Kolanii", ["Hardcore", "Challenges"]],                // ✓ Hardcore + 100 days challenges
  ["Renderingframes", ["Hardcore"]],
  ["SocksApollo", ["Hardcore"]],
  ["FR3shlol", ["Challenges"]],
  ["TheMoreOfNeo", ["Challenges"]],
  ["MindOfNeo", ["Challenges"]],
  ["NeosMindMc", ["Challenges"]],
  ["CloolessGamingg", ["Hardcore"]],
  ["Jamsteo", ["Hardcore"]],
  ["FitCereal", ["Hardcore"]],
  ["SpeedSilver", ["Speedrun & Manhunt"]],
  ["DumbIsDumb", ["Challenges"]],
  ["dol9hin", ["Challenges"]],
  ["Branzy", ["SMP & Story"]],                            // ✓ former Lifesteal SMP member
  ["sea4", ["Hardcore"]],
  ["JoofyLooby", ["PvP & Minigames"]],
  ["ThatChiefGuy", ["Hardcore"]],
  ["jojosolos", ["Hardcore"]],
  ["Jackswano", ["Challenges"]],
  ["FarzyMC", ["SMP & Story"]],
  ["Beppojoe", ["Hardcore"]],
  ["MrBeastGaming", ["Challenges"]],
  ["Spokeishere", ["SMP & Story"]],                       // ✓ Lifesteal SMP + Unstable Universe
  ["dream", ["SMP & Story", "Speedrun & Manhunt"]],       // ✓ Manhunt, speedruns, Dream SMP
  ["BoofAndBung", ["PvP & Minigames"]],
  ["aCookieGod", ["Hardcore"]],
  ["wyll_", ["Hardcore"]],
  ["InfamousJJ", ["Hardcore"]],
  ["Slushly", ["Challenges"]],
  ["TheobaldTheBird", ["Mods"]],
  ["LuigiToan", ["Hardcore"]],
  ["EpaxialYT", ["Hardcore"]],
  ["AiroKunn", ["Hardcore"]],
  ["OnlyASquid", ["Hardcore"]],
  ["KnappYT", ["Challenges"]],
  ["cyproh", ["PvP & Minigames"]],
  ["PierceTRV", ["Hardcore"]],
  ["OfficialCheckpoint", ["SMP & Story"]],
  ["MisterRoyalty", ["Hardcore"]],
  ["CheapPickle", ["Challenges"]],
  ["Wallibear", ["Hardcore"]],
  ["Karl", ["SMP & Story"]],
  ["yaboysneak", ["Hardcore"]],
  ["ApolloTVs", ["Hardcore"]],
];

/* Optional: force a specific display name (wins over the YouTube channel title).
   Leave a channel out to use its real YouTube channel name automatically. */
const DISPLAY_NAMES = {
  FlameFragsMC: "FlameFrags",
  ParrotX2: "Parrot",
  wemmbumc: "Wemmbu",
  Spokeishere: "Spoke",
  MrBeastGaming: "MrBeast Gaming",
  dream: "Dream",
};

/* ============ APP ============ */
const API = "https://www.googleapis.com/youtube/v3/channels";
const STORE = "mc_creators_v1";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.7,.2,1)";

const grid = document.getElementById("grid");
const popularBtn = document.getElementById("popular");
const catBtn = document.getElementById("catbtn");
const catLabel = document.getElementById("catlabel");
const menu = document.getElementById("menu");

let data = {};   // handle -> { id, name, pfp, subs }
try { data = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { data = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {} };

const state = { popular: false, cat: "all" };
const order = CREATORS.map(c => c[0]);
const catsOf = Object.fromEntries(CREATORS);

function fmt(n) {
  if (n == null || isNaN(n)) return "? Subs";
  const f = (v, s) => (Math.round(v * 10) / 10).toString().replace(/\.0$/, "") + s + " Subs";
  if (n >= 1e6) return f(n / 1e6, "M");
  if (n >= 1e3) return f(n / 1e3, "K");
  return Math.round(n) + " Subs";
}

/* ---------- cards (built once, updated in place) ---------- */
const cards = {};
order.forEach(h => {
  const el = document.createElement("a");
  el.className = "card"; el.hidden = true;
  el.href = "https://www.youtube.com/@" + h;
  el.target = "_blank"; el.rel = "noopener noreferrer";
  const img = document.createElement("img");
  img.className = "pfp wait"; img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
  img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const name = document.createElement("div"); name.className = "name"; name.textContent = DISPLAY_NAMES[h] || h;
  const subs = document.createElement("div"); subs.className = "subs"; subs.textContent = "? Subs";
  el.append(img, name, subs);
  grid.appendChild(el);
  cards[h] = { el, img, name, subs, shown: null, raf: 0 };
});

function countTo(c, target) {
  cancelAnimationFrame(c.raf);
  if (target == null || isNaN(target)) { c.subs.textContent = "? Subs"; c.shown = null; return; }
  const from = c.shown == null ? 0 : c.shown;
  if (reduce || from === target) { c.shown = target; c.subs.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    c.shown = from + (target - from) * e;
    c.subs.textContent = fmt(c.shown);
    if (p < 1) c.raf = requestAnimationFrame(step); else { c.shown = target; c.subs.textContent = fmt(target); }
  };
  c.raf = requestAnimationFrame(step);
}

function paint(h) {
  const c = cards[h], d = data[h];
  if (!d) return;
  const nm = DISPLAY_NAMES[h] || d.name;
  if (nm && c.name.textContent !== nm) c.name.textContent = nm;
  if (d.pfp && c.img.dataset.src !== d.pfp) {
    c.img.dataset.src = d.pfp;
    const pre = new Image();
    pre.referrerPolicy = "no-referrer";
    pre.onload = () => {
      c.img.classList.add("fade");
      requestAnimationFrame(() => {
        c.img.src = d.pfp;
        c.img.classList.remove("wait");
        requestAnimationFrame(() => c.img.classList.remove("fade"));
      });
    };
    pre.src = d.pfp;
  }
  if (c.shown !== d.subs) countTo(c, d.subs);
}

/* ---------- layout with smooth reordering (FLIP) ---------- */
function layout(animate) {
  let list = order.filter(h => state.cat === "all" || catsOf[h].includes(state.cat));
  if (state.popular) list = [...list].sort((a, b) => ((data[b] || {}).subs || 0) - ((data[a] || {}).subs || 0));
  const keep = new Set(list);

  const first = {};
  if (animate && !reduce) order.forEach(h => { if (!cards[h].el.hidden) first[h] = cards[h].el.getBoundingClientRect(); });

  order.forEach(h => { cards[h].el.hidden = !keep.has(h); });
  list.forEach(h => grid.appendChild(cards[h].el));

  if (reduce) return;
  list.forEach((h, i) => {
    const el = cards[h].el, f = first[h];
    if (f) {
      const l = el.getBoundingClientRect();
      const dx = f.left - l.left, dy = f.top - l.top;
      if (dx || dy) el.animate(
        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
        { duration: 550, easing: EASE });
    } else {
      el.animate(
        [{ opacity: 0, transform: "translateY(16px) scale(.96)" }, { opacity: 1, transform: "none" }],
        { duration: 500, delay: Math.min(i, 20) * 30, easing: EASE, fill: "backwards" });
    }
  });
}

/* ---------- controls ---------- */
const cats = [...new Set(CREATORS.flatMap(c => c[1]))].sort();
[["all", "All"], ...cats.map(c => [c, c])].forEach(([v, label]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "item" + (v === "all" ? " sel" : ""); b.dataset.v = v;
  b.setAttribute("role", "menuitem"); b.textContent = label;
  menu.appendChild(b);
});

function setMenu(open) {
  menu.classList.toggle("open", open);
  catBtn.setAttribute("aria-expanded", open);
}

popularBtn.addEventListener("click", () => {
  state.popular = !state.popular;
  popularBtn.classList.toggle("on", state.popular);
  popularBtn.setAttribute("aria-pressed", state.popular);
  layout(true);
});

catBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); });
menu.addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  state.cat = b.dataset.v;
  menu.querySelectorAll(".item").forEach(i => i.classList.toggle("sel", i === b));
  catLabel.textContent = state.cat === "all" ? "Category" : b.textContent;
  catBtn.classList.toggle("on", state.cat !== "all");
  setMenu(false);
  layout(true);
});
document.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") { setMenu(false); catBtn.focus(); } });

/* ---------- YouTube API ---------- */
async function call(params) {
  const r = await fetch(API + "?part=snippet,statistics&key=" + API_KEY + "&" + params);
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.json();
}
function apply(handle, item) {
  const sn = item.snippet || {}, st = item.statistics || {}, t = sn.thumbnails || {};
  data[handle] = {
    id: item.id,
    name: sn.title || handle,
    pfp: (t.high || t.medium || t.default || {}).url || "",
    subs: st.hiddenSubscriberCount ? null : Number(st.subscriberCount),
  };
}

async function refresh() {
  if (!API_KEY || API_KEY.startsWith("PASTE")) return;
  try {
    // Look up handles we haven't resolved yet (once, then cached in the browser)
    const missing = order.filter(h => !data[h] || !data[h].id);
    for (let i = 0; i < missing.length; i += 10) {
      await Promise.all(missing.slice(i, i + 10).map(async h => {
        const j = await call("forHandle=" + encodeURIComponent("@" + h));
        if (j.items && j.items[0]) { apply(h, j.items[0]); paint(h); }
      }));
    }
    // Cheap batched refresh: 50 channels per request
    const known = order.filter(h => data[h] && data[h].id);
    for (let i = 0; i < known.length; i += 50) {
      const chunk = known.slice(i, i + 50);
      const byId = Object.fromEntries(chunk.map(h => [data[h].id, h]));
      const j = await call("id=" + chunk.map(h => data[h].id).join(",") + "&maxResults=50");
      (j.items || []).forEach(it => { apply(byId[it.id], it); paint(byId[it.id]); });
    }
    save();
    if (state.popular) layout(true);   // re-sort smoothly if counts changed
  } catch (e) { console.error("YouTube API error:", e); }
}

/* ---------- start ---------- */
order.forEach(paint);   // show cached data instantly
layout(true);           // entrance animation
refresh();
setInterval(refresh, REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
