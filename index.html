/* ============ APP ============ */
const API = "https://www.googleapis.com/youtube/v3/channels";
const STORE = "mc_creators_v1";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.2,.7,.2,1)";

const grid = document.getElementById("grid");
const dgrid = document.getElementById("dgrid");
const popularBtn = document.getElementById("popular");
const catBtn = document.getElementById("catbtn");
const catLabel = document.getElementById("catlabel");
const menu = document.getElementById("menu");
const tabC = document.getElementById("tabC");
const tabD = document.getElementById("tabD");
const creatorControls = document.getElementById("creatorControls");

let data = {};   // handle -> { id, name, pfp, subs }
try { data = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { data = {}; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {} };

const state = { popular: false, cat: "all", view: "creators" };
const order = CREATORS.map(c => c[0]);
const catsOf = Object.fromEntries(CREATORS);

function fmt(n) {
  if (n == null || isNaN(n)) return "? Subs";
  const f = (v, s) => (Math.round(v * 10) / 10).toString().replace(/\.0$/, "") + s + " Subs";
  if (n >= 1e6) return f(n / 1e6, "M");
  if (n >= 1e3) return f(n / 1e3, "K");
  return Math.round(n) + " Subs";
}

/* ---------- creator cards (built once, updated in place) ---------- */
const cards = {};
order.forEach(h => {
  const el = document.createElement("a");
  el.className = "card"; el.hidden = true;
  el.href = "https://www.youtube.com/@" + h;
  el.target = "_blank"; el.rel = "noopener noreferrer";
  const img = document.createElement("img");
  img.className = "pfp wait"; img.alt = ""; img.decoding = "async"; img.referrerPolicy = "no-referrer";
  img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const name = document.createElement("div"); name.className = "name"; name.textContent = DISPLAY_NAMES[h] || h;
  const subs = document.createElement("div"); subs.className = "subs"; subs.textContent = "? Subs";
  el.append(img, name, subs);
  grid.appendChild(el);
  cards[h] = { el, img, name, subs, shown: null, raf: 0 };
});

function countTo(c, target) {
  cancelAnimationFrame(c.raf);
  if (target == null || isNaN(target)) { c.subs.textContent = "? Subs"; c.shown = null; return; }
  const from = c.shown == null ? 0 : c.shown;
  if (reduce || from === target) { c.shown = target; c.subs.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    c.shown = from + (target - from) * e;
    c.subs.textContent = fmt(c.shown);
    if (p < 1) c.raf = requestAnimationFrame(step); else { c.shown = target; c.subs.textContent = fmt(target); }
  };
  c.raf = requestAnimationFrame(step);
}

function paint(h) {
  const c = cards[h], d = data[h];
  if (!d) return;
  const nm = DISPLAY_NAMES[h] || d.name;
  if (nm && c.name.textContent !== nm) c.name.textContent = nm;
  if (d.pfp && c.img.dataset.src !== d.pfp) {
    c.img.dataset.src = d.pfp;
    const pre = new Image();
    pre.referrerPolicy = "no-referrer";
    pre.onload = () => {
      c.img.classList.add("fade");
      requestAnimationFrame(() => {
        c.img.src = d.pfp;
        c.img.classList.remove("wait");
        requestAnimationFrame(() => c.img.classList.remove("fade"));
      });
    };
    pre.src = d.pfp;
  }
  if (c.shown !== d.subs) countTo(c, d.subs);
}

/* ---------- smooth entrance ---------- */
function enter(els) {
  if (reduce) return;
  els.forEach((el, i) => el.animate(
    [{ opacity: 0, transform: "translateY(16px) scale(.96)" }, { opacity: 1, transform: "none" }],
    { duration: 500, delay: Math.min(i, 20) * 30, easing: EASE, fill: "backwards" }));
}

/* ---------- creator layout with smooth reordering (FLIP) ---------- */
function layout(animate) {
  let list = order.filter(h => state.cat === "all" || catsOf[h].includes(state.cat));
  if (state.popular) list = [...list].sort((a, b) => ((data[b] || {}).subs || 0) - ((data[a] || {}).subs || 0));
  const keep = new Set(list);

  const first = {};
  if (animate && !reduce) order.forEach(h => { if (!cards[h].el.hidden) first[h] = cards[h].el.getBoundingClientRect(); });

  order.forEach(h => { cards[h].el.hidden = !keep.has(h); });
  list.forEach(h => grid.appendChild(cards[h].el));

  if (reduce) return;
  const fresh = [];
  list.forEach(h => {
    const el = cards[h].el, f = first[h];
    if (f) {
      const l = el.getBoundingClientRect();
      const dx = f.left - l.left, dy = f.top - l.top;
      if (dx || dy) el.animate(
        [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
        { duration: 550, easing: EASE });
    } else fresh.push(el);
  });
  enter(fresh);
}

/* ---------- creator controls ---------- */
const cats = [...new Set(CREATORS.flatMap(c => c[1]))].sort();
[["all", "All"], ...cats.map(c => [c, c])].forEach(([v, label]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "item" + (v === "all" ? " sel" : ""); b.dataset.v = v;
  b.setAttribute("role", "menuitem"); b.textContent = label;
  menu.appendChild(b);
});

function setMenu(open) {
  menu.classList.toggle("open", open);
  catBtn.setAttribute("aria-expanded", open);
}

popularBtn.addEventListener("click", () => {
  state.popular = !state.popular;
  popularBtn.classList.toggle("on", state.popular);
  popularBtn.setAttribute("aria-pressed", state.popular);
  layout(true);
});

catBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(!menu.classList.contains("open")); });
menu.addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  state.cat = b.dataset.v;
  menu.querySelectorAll(".item").forEach(i => i.classList.toggle("sel", i === b));
  catLabel.textContent = state.cat === "all" ? "Category" : b.textContent;
  catBtn.classList.toggle("on", state.cat !== "all");
  setMenu(false);
  layout(true);
});
document.addEventListener("click", () => setMenu(false));

/* ---------- designers: cards + slide-down socials ---------- */
function tint(s) {
  let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 22% 44%)`;
}

const dcards = DESIGNERS.map((d, i) => {
  const el = document.createElement("button");
  el.type = "button"; el.className = "card dcard"; el.setAttribute("aria-expanded", "false");
  const av = document.createElement("div");
  av.className = "pfp ph"; av.style.background = tint(d.name);
  av.textContent = d.name.trim().charAt(0).toUpperCase();
  if (d.pfp) {
    const im = new Image();
    im.className = "avimg"; im.alt = ""; im.referrerPolicy = "no-referrer";
    im.onload = () => im.classList.add("ok");
    im.onerror = () => im.remove();
    im.src = d.pfp;
    av.appendChild(im);
  }
  const name = document.createElement("div"); name.className = "name"; name.textContent = d.name;
  const role = document.createElement("div"); role.className = "subs"; role.textContent = d.role || "";
  el.append(av, name, role);
  el.addEventListener("click", e => { e.stopPropagation(); toggleDesigner(i); });
  dgrid.appendChild(el);
  return { el };
});

let openIdx = -1, panelEl = null;
const colCount = () => Math.max(1, getComputedStyle(dgrid).gridTemplateColumns.split(" ").length);

function buildPanel(d) {
  const p = document.createElement("div"); p.className = "panel"; p.setAttribute("role", "region");
  p.addEventListener("click", e => e.stopPropagation());
  const pin = document.createElement("div"); pin.className = "pin";
  const box = document.createElement("div"); box.className = "pbox";
  if (d.bio) {
  const b = document.createElement("p");
  b.className = "bio";
  b.innerHTML = d.bio;
  box.appendChild(b);
}
  const links = document.createElement("div"); links.className = "links";
  (d.links || []).forEach(([label, value]) => {
    if (/^https?:\/\//.test(value)) {
      const a = document.createElement("a");
      a.className = "chip"; a.href = value; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = label;
      links.appendChild(a);
    } else {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.title = "Copy";
      b.innerHTML = ""; b.append(label + " ");
      const s = document.createElement("small"); s.textContent = value; b.appendChild(s);
      b.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(value); s.textContent = "Copied"; setTimeout(() => (s.textContent = value), 1400); } catch (e) {}
      });
      links.appendChild(b);
    }
  });
  box.appendChild(links);
  pin.appendChild(box); p.appendChild(pin);
  return p;
}

function placePanel(i) {
  const c = colCount();
  const end = Math.min(DESIGNERS.length - 1, (Math.floor(i / c) + 1) * c - 1);
  dcards[end].el.after(panelEl);
}

function closePanel(animate) {
  if (!panelEl) return;
  const p = panelEl, idx = openIdx;
  panelEl = null; openIdx = -1;
  dcards[idx].el.setAttribute("aria-expanded", "false");
  dcards[idx].el.classList.remove("sel");
  if (animate && !reduce) {
  p.classList.remove("open");
  setTimeout(() => p.remove(), 560);
}
  else p.remove();
}

function toggleDesigner(i) {
  if (openIdx === i) { closePanel(true); return; }
  closePanel(true);
  openIdx = i;
  panelEl = buildPanel(DESIGNERS[i]);
  dcards[i].el.setAttribute("aria-expanded", "true");
  dcards[i].el.classList.add("sel");
  placePanel(i);
  void panelEl.offsetHeight;          // let the browser register the closed state first
  panelEl.classList.add("open");
  if (!reduce) setTimeout(() => panelEl && panelEl.scrollIntoView({ block: "nearest", behavior: "smooth" }), 120);
}

let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (panelEl) placePanel(openIdx); }, 120);
});

/* ---------- Creators / Designers switch ---------- */
function setView(v) {
  if (state.view === v) return;
  state.view = v;
  closePanel(false); setMenu(false);
  tabC.classList.toggle("on", v === "creators"); tabC.setAttribute("aria-selected", v === "creators");
  tabD.classList.toggle("on", v === "designers"); tabD.setAttribute("aria-selected", v === "designers");
  creatorControls.hidden = v !== "creators";
  grid.hidden = v !== "creators";
  dgrid.hidden = v !== "designers";
  document.getElementById("designerIntro").hidden = v !== "designers";
  enter(v === "creators" ? order.filter(h => !cards[h].el.hidden).map(h => cards[h].el) : dcards.map(c => c.el));
}
tabC.addEventListener("click", () => setView("creators"));
tabD.addEventListener("click", () => setView("designers"));

document.addEventListener("click", () => closePanel(true));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { setMenu(false); closePanel(true); }
});

/* ---------- YouTube API ---------- */
async function call(params) {
  const r = await fetch(API + "?part=snippet,statistics&key=" + API_KEY + "&" + params);
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.json();
}
function apply(handle, item) {
  const sn = item.snippet || {}, st = item.statistics || {}, t = sn.thumbnails || {};
  data[handle] = {
    id: item.id,
    name: sn.title || handle,
    pfp: (t.high || t.medium || t.default || {}).url || "",
    subs: st.hiddenSubscriberCount ? null : Number(st.subscriberCount),
  };
}

async function refresh() {
  if (!API_KEY || API_KEY.startsWith("PASTE")) return;
  try {
    // Look up handles we haven't resolved yet (once, then cached in the browser)
    const missing = order.filter(h => !data[h] || !data[h].id);
    for (let i = 0; i < missing.length; i += 10) {
      await Promise.all(missing.slice(i, i + 10).map(async h => {
        const j = await call("forHandle=" + encodeURIComponent("@" + h));
        if (j.items && j.items[0]) { apply(h, j.items[0]); paint(h); }
      }));
    }
    // Cheap batched refresh: 50 channels per request
    const known = order.filter(h => data[h] && data[h].id);
    for (let i = 0; i < known.length; i += 50) {
      const chunk = known.slice(i, i + 50);
      const byId = Object.fromEntries(chunk.map(h => [data[h].id, h]));
      const j = await call("id=" + chunk.map(h => data[h].id).join(",") + "&maxResults=50");
      (j.items || []).forEach(it => { apply(byId[it.id], it); paint(byId[it.id]); });
    }
    save();
    if (state.popular) layout(true);   // re-sort smoothly if counts changed
  } catch (e) { console.error("YouTube API error:", e); }
}

/* ---------- start ---------- */
order.forEach(paint);   // show cached data instantly
layout(true);           // entrance animation
refresh();
setInterval(refresh, REFRESH_MINUTES * 60 * 1000);
</script>
